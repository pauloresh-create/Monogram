# MARK: Monogram
# Builds an IPA signed with the repo's fake certificates.
# Re-sign it with your own Apple ID (Sideloadly / AltStore) before installing;
# set a unique bundle ID there.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TG_API_ID    - from https://my.telegram.org/apps
#   TG_API_HASH  - from https://my.telegram.org/apps
#   IPA_PASSWORD - password for the encrypted zip with the IPA

name: Monogram build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          WANTED=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_$WANTED.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$WANTED.app/Contents/Developer"
          else
            echo "::warning::Xcode $WANTED is not on this runner, using the newest one available"
            LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version

      - name: Write build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::Set TG_API_ID and TG_API_HASH repository secrets first"
            exit 1
          fi
          python3 - <<'EOF'
          import json, os
          cfg = json.load(open("build-system/template_minimal_development_configuration.json"))
          cfg.update({
              # matches the fake provisioning profiles; change the bundle ID when re-signing
              "bundle_id": "ph.telegra.Telegraph",
              "api_id": os.environ["TG_API_ID"],
              "api_hash": os.environ["TG_API_HASH"],
              "team_id": "C67CF9S4VU",
              "is_internal_build": "false",
              "is_appstore_build": "false",
          })
          json.dump(cfg, open("monogram-configuration.json", "w"), indent=2)
          EOF
          # Swiftgram's extra extension has no fake profile; reuse the Share one.
          P=build-system/fake-codesigning/profiles
          [ -f "$P/SGActionRequestHandler.mobileprovision" ] || cp "$P/Share.mobileprovision" "$P/SGActionRequestHandler.mobileprovision"

      - name: Copy sources to a stable path
        run: |
          sudo mkdir -p /Users/Shared
          sudo chown "$USER" /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Build
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot=/private/var/tmp/_bazel_ci \
            --overrideXcodeVersion \
            build \
            --continueOnError \
            --configurationPath=monogram-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
          mkdir -p out
          cp bazel-bin/Telegram/Telegram.ipa out/Monogram.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /Users/Shared/telegram-ios/build.log
          if-no-files-found: ignore
          retention-days: 7

      # The IPA contains your api_hash and the repo is public, so it is uploaded
      # only inside an AES-256 zip locked with the IPA_PASSWORD secret (open with 7-Zip).
      - name: Encrypt IPA
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          if [ -z "$IPA_PASSWORD" ]; then
            echo "::error::Set the IPA_PASSWORD repository secret; the IPA is never uploaded unencrypted"
            exit 1
          fi
          brew install sevenzip >/dev/null
          cd /Users/Shared/telegram-ios/out
          7zz a -tzip -mem=AES256 -p"$IPA_PASSWORD" Monogram-ipa.zip Monogram.ipa >/dev/null
          rm Monogram.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Monogram-ipa-encrypted
          path: /Users/Shared/telegram-ios/out/Monogram-ipa.zip
          retention-days: 7
